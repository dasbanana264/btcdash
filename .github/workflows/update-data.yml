name: Update BTC / S&P 500 data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh data
        run: python3 scripts/update_data.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No price change, nothing to commit."
            exit 0
          fi
          git config user.name "btc-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh BTC / S&P 500 data"
          git push
